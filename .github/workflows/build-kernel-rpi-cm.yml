# Build 64-bit Raspberry Pi kernel (bcm2712_defconfig) for CM4/CM5 class boards.
# Produces Image.gz, modules, and Broadcom DTBs in a versioned tarball artifact.
# Optional: publish tarball + index.html to GitHub Pages (branch below or workflow_dispatch).

name: Build kernel (RPi CM4/CM5, arm64)

on:
  push:
  workflow_dispatch:

env:
  # Used by run steps only. Job/step `if:` cannot use `env` (GitHub limitation); keep branch in sync below.
  PAGES_PUBLISH_BRANCH: clockworkpi-7.1.y-live

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kernel-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex gcc gcc-aarch64-linux-gnu \
            libssl-dev libncurses-dev make python3 rsync xz-utils

      - name: Configure kernel
        run: |
          set -euo pipefail
          make bcm2712_defconfig
          # 4K pages + 39-bit VA instead of bcm2712 16K/47VA (merge + olddefconfig, not sed)
          ./scripts/kconfig/merge_config.sh -m .config "${GITHUB_WORKSPACE}/.github/clockworkpi-4k-pages.fragment"
          make olddefconfig
          grep -q '^CONFIG_ARM64_4K_PAGES=y' .config
          grep -q '^CONFIG_PAGE_SHIFT=12' .config
          KERNELRELEASE="$(make -s kernelrelease)"
          echo "KERNELRELEASE=${KERNELRELEASE}" >> "${GITHUB_ENV}"
          echo "Kernel release: ${KERNELRELEASE}"

      - name: Build Image.gz, modules, and dtbs
        run: |
          set -euo pipefail
          make -j$(nproc) Image.gz modules dtbs

      - name: Stage artifacts
        run: |
          set -euo pipefail
          STAGE="${GITHUB_WORKSPACE}/kernel-artifact"
          mkdir -p "${STAGE}/modules" "${STAGE}/dtbs" "${STAGE}/dtbs/overlays"
          cp arch/arm64/boot/Image.gz "${STAGE}/kernel-${KERNELRELEASE}.img"
          # Cross-build: skip host depmod (wrong arch for /sbin/depmod)
          make INSTALL_MOD_PATH="${STAGE}/modules" INSTALL_MOD_STRIP=1 \
            DEPMOD=/bin/true modules_install
          cp arch/arm64/boot/dts/broadcom/*.dtb "${STAGE}/dtbs/"
          cp arch/arm64/boot/dts/overlays/*.dtb "${STAGE}/dtbs/overlays/"

      - name: Pack release archive
        run: |
          set -euo pipefail
          OUT="${GITHUB_WORKSPACE}/kernel-clockworkpi-${KERNELRELEASE}.tar.xz"
          tar -C "${GITHUB_WORKSPACE}/kernel-artifact" -cJf "${OUT}" .
          ls -lh "${OUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: kernel-clockworkpi-${{ env.KERNELRELEASE }}
          path: kernel-clockworkpi-${{ env.KERNELRELEASE }}.tar.xz
          if-no-files-found: error

