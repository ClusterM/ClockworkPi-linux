# Build 64-bit Raspberry Pi kernel (bcm2712_defconfig) for CM4/CM5 class boards.
# Produces linux-image / linux-headers Debian packages, a linux-image-clockworkpi
# metapackage, and (on the live branch / workflow_dispatch) a signed APT repo on
# GitHub Pages.

name: Build kernel (RPi CM4/CM5, arm64)

on:
  push:
  workflow_dispatch:

env:
  # Used by run steps only. Job/step `if:` cannot use `env` (GitHub limitation); keep branch in sync below.
  PAGES_PUBLISH_BRANCH: clockworkpi-7.2.y-live

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kernel-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      # Cross-build: host depmod cannot process arm64 modules
      DEPMOD: /bin/true
      # Suppress trailing '+' from scripts/setlocalversion when HEAD is not
      # an annotated tag (CONFIG_LOCALVERSION from .config still applies).
      LOCALVERSION: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential gcc gcc-aarch64-linux-gnu \
            libc6-dev libc6-dev-arm64-cross \
            libssl-dev libncurses-dev libelf-dev libdw-dev \
            make python3 rsync xz-utils zstd \
            dpkg-dev debhelper fakeroot gnupg dirmngr

      - name: Configure kernel
        run: |
          set -euo pipefail
          make bcm2712_defconfig
          # 4K pages + 39-bit VA + LOCALVERSION from fragment
          ./scripts/kconfig/merge_config.sh -m .config "${GITHUB_WORKSPACE}/.github/clockworkpi-4k-pages.fragment"
          make olddefconfig
          # merge_config -m only touches .config; ensure auto.conf / kernel.release match
          rm -f include/config/kernel.release
          make -s syncconfig
          grep -q '^CONFIG_ARM64_4K_PAGES=y' .config
          grep -q '^CONFIG_PAGE_SHIFT=12' .config
          grep -q 'CONFIG_LOCALVERSION=.*clockworkpi' .config
          grep -q 'CONFIG_LOCALVERSION=.*clockworkpi' include/config/auto.conf
          KERNELRELEASE="$(make -s kernelrelease)"
          if [[ "${KERNELRELEASE}" != *clockworkpi* ]]; then
            echo "error: KERNELRELEASE='${KERNELRELEASE}' missing clockworkpi localversion" >&2
            grep LOCALVERSION .config include/config/auto.conf >&2 || true
            exit 1
          fi
          if [[ "${KERNELRELEASE}" == *+ ]]; then
            echo "error: KERNELRELEASE='${KERNELRELEASE}' ends with '+'" >&2
            exit 1
          fi
          echo "KERNELRELEASE=${KERNELRELEASE}" >> "${GITHUB_ENV}"
          echo "Kernel release: ${KERNELRELEASE}"

      - name: Build Debian packages (bindeb-pkg)
        run: |
          set -euo pipefail
          # Monotonic package revision for APT upgrades / pruning
          KDEB_PKGVERSION="${{ github.run_number }}"
          export KDEB_PKGVERSION
          export KDEB_CHANGELOG_DIST=stable
          export KBUILD_DEBARCH=arm64
          # -d: skip build-dep check (host is amd64, package arch is arm64)
          make -j"$(nproc)" bindeb-pkg DPKG_FLAGS=-d
          mkdir -p "${GITHUB_WORKSPACE}/debs"
          # Packages are written to the parent of the source tree
          find "${GITHUB_WORKSPACE}/.." -maxdepth 1 -type f -name '*.deb' -print
          # Keep image/headers only (skip dbg / libc-dev)
          find "${GITHUB_WORKSPACE}/.." -maxdepth 1 -type f \( \
              -name "linux-image-${KERNELRELEASE}_*.deb" -o \
              -name "linux-headers-${KERNELRELEASE}_*.deb" \
            \) -exec mv -t "${GITHUB_WORKSPACE}/debs/" {} +
          ls -lh "${GITHUB_WORKSPACE}/debs/"

      - name: Inject firmware hooks into linux-image
        run: |
          set -euo pipefail
          img_deb="$(ls "${GITHUB_WORKSPACE}/debs"/linux-image-"${KERNELRELEASE}"_*.deb)"
          "${GITHUB_WORKSPACE}/.github/scripts/inject-kernel-hooks.sh" \
            "${img_deb}" \
            "${GITHUB_WORKSPACE}/.github/kernel-hooks"

      - name: Build linux-image-clockworkpi metapackage
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/.github/scripts/build-meta-package.sh" \
            "${KERNELRELEASE}" \
            "${{ github.run_number }}" \
            "${GITHUB_WORKSPACE}/debs"
          ls -lh "${GITHUB_WORKSPACE}/debs/"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v6
        with:
          name: kernel-debs-${{ env.KERNELRELEASE }}
          path: debs/*.deb
          if-no-files-found: error

      - name: Prepare GitHub Pages APT bundle
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'clockworkpi-7.2.y-live'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          KERNELRELEASE: ${{ env.KERNELRELEASE }}
        run: |
          set -euo pipefail
          if [[ -z "${APT_GPG_PRIVATE_KEY:-}" ]]; then
            echo "error: repository secret APT_GPG_PRIVATE_KEY is not set" >&2
            echo "Create a GPG key and add the armored private key as APT_GPG_PRIVATE_KEY." >&2
            exit 1
          fi

          PAGES="${GITHUB_WORKSPACE}/pages"
          PREV="${GITHUB_WORKSPACE}/prev-apt"
          mkdir -p "${PAGES}" "${PREV}"

          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          APT_BASE="https://${OWNER}.github.io/${REPO_NAME}/apt"
          "${GITHUB_WORKSPACE}/.github/scripts/fetch-apt-pool.sh" "${APT_BASE}" "${PREV}" || true

          "${GITHUB_WORKSPACE}/.github/scripts/publish-apt-repo.sh" \
            "${PAGES}" \
            "${GITHUB_WORKSPACE}/debs" \
            "${PREV}"

          "${GITHUB_WORKSPACE}/.github/scripts/generate-pages-index.sh" \
            "${PAGES}" \
            "${KERNELRELEASE}"

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'clockworkpi-7.2.y-live'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'clockworkpi-7.2.y-live'
        env:
          GH_TOKEN: ${{ github.token }}
          KERNELRELEASE: ${{ env.KERNELRELEASE }}
        run: |
          set -euo pipefail
          tag="kernel-${KERNELRELEASE}"
          title="Kernel ${KERNELRELEASE}"
          # Replace release for the same tag when rebuilding the same version string
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release delete "${tag}" --yes --cleanup-tag
          fi
          gh release create "${tag}" \
            --title "${title}" \
            --notes "ClockworkPi / uConsole arm64 kernel ${KERNELRELEASE}. Install via the APT repo on GitHub Pages, or download the .deb files attached here." \
            "${GITHUB_WORKSPACE}/debs"/*.deb

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'clockworkpi-7.2.y-live'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
